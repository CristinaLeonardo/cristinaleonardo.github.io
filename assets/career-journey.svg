<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="cj-title cj-desc">
  <title id="cj-title">Career journey illustration</title>
  <desc id="cj-desc">A young scientist examining a spectrum with a magnifying glass grows, step by step, into a product builder sketching a device, a product manager running a product lifecycle, and finally a lead product person surrounded by an AI network, creating impact for people.</desc>
  <style>
    svg { --ink:#1f2a37; --accent:#0d9488; --soft:#ccefe9; --warm:#8b5cf6; --muted:#94a3b8; --paper:#ffffff; }
    .ink{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .fill-ink{fill:var(--ink)}
    .accent{stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .fill-accent{fill:var(--accent)}
    .soft{fill:var(--soft)}
    .warm{fill:var(--warm)}
    .paper{fill:var(--paper)}
    .label{font:600 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink);text-anchor:middle}
    .sub{font:400 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--muted);text-anchor:middle}
    .thread{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:6 7;opacity:.7}
    .ground{stroke:var(--muted);stroke-width:2;fill:none;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s ease-out forwards}
    .stage{opacity:0;animation:rise .8s ease-out forwards}
    .s1{animation-delay:.3s}.s2{animation-delay:.9s}.s3{animation-delay:1.5s}.s4{animation-delay:2.1s}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out 3s infinite}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.55}}
    @media (prefers-reduced-motion:reduce){.ground{animation:none;stroke-dashoffset:0}.stage{animation:none;opacity:1}.pulse{animation:none}}
    @media (prefers-color-scheme:dark){svg{--ink:#e5e7eb;--soft:#134e48;--muted:#7b8794;--paper:#1f2a37;--warm:#a78bfa}}
  </style>

  <!-- The rising ground: growth over time -->
  <path class="ground" d="M30,365 C250,365 300,350 450,345 S750,332 850,322 S1050,298 1170,290"/>

  <!-- The common thread: same question, different lens -->
  <path class="thread" d="M300,228 C420,150 560,150 640,175 S820,150 900,140 S1000,95 1040,98"/>

  <!-- ============ Stage 1: the curious scientist ============ -->
  <g class="stage s1">
    <!-- spectrum + data -->
    <path class="accent" d="M215,270 C235,270 240,215 255,215 S270,262 282,262 S292,232 302,232 S312,268 330,268"/>
    <line class="ink" x1="212" y1="272" x2="335" y2="272" opacity=".35"/>
    <circle class="fill-accent" cx="230" cy="200" r="3"/><circle class="fill-accent" cx="246" cy="190" r="2.5"/>
    <circle class="fill-accent" cx="265" cy="196" r="3.5"/><circle class="fill-accent" cx="285" cy="184" r="2.5"/>
    <circle class="fill-accent" cx="300" cy="200" r="3"/><circle class="fill-accent" cx="318" cy="190" r="2"/>
    <!-- flask -->
    <path class="ink" d="M95,365 l0,-5 M88,300 h14 M91,300 v22 l-14,30 q-2,6 5,6 h26 q7,0 5,-6 l-14,-30 v-22"/>
    <path class="soft" d="M84,345 l-5,10 q-1,4 4,4 h24 q5,0 4,-4 l-5,-10 z"/>
    <g transform="translate(170,364) scale(.8)">
      <line class="ink" x1="-8" y1="-50" x2="-11" y2="0"/><line class="ink" x1="8" y1="-50" x2="11" y2="0"/>
      <path class="paper ink" d="M-21,-48 Q-24,-106 0,-108 Q24,-106 21,-48 Z" style="fill:var(--paper)"/>
      <line class="ink" x1="0" y1="-104" x2="0" y2="-55" opacity=".5"/>
      <path class="ink" d="M15,-95 L34,-100"/>
      <circle class="ink" cx="0" cy="-126" r="16" style="fill:var(--paper)"/>
      <g class="fill-ink"><circle cx="-14" cy="-136" r="7"/><circle cx="-4" cy="-143" r="7"/><circle cx="8" cy="-142" r="7"/><circle cx="16" cy="-133" r="6"/><circle cx="-18" cy="-124" r="6"/><circle cx="-16" cy="-112" r="5"/></g>
      <circle class="ink" cx="-1" cy="-124" r="4" style="stroke-width:1.8"/><circle class="ink" cx="9" cy="-124" r="4" style="stroke-width:1.8"/>
      <!-- magnifier -->
      <line class="ink" x1="34" y1="-100" x2="48" y2="-114" style="stroke-width:4"/>
      <circle class="ink" cx="60" cy="-126" r="15" style="fill:var(--soft);fill-opacity:.6"/>
    </g>
    <text class="label" x="170" y="398">Curiosity</text>
    <text class="sub" x="170" y="417">Science · ML · diagnostics</text>
  </g>

  <!-- ============ Stage 2: the product builder ============ -->
  <g class="stage s2">
    <!-- blueprint board -->
    <rect x="515" y="190" width="120" height="90" rx="6" class="soft"/>
    <rect x="515" y="190" width="120" height="90" rx="6" class="ink" style="stroke-width:2"/>
    <g class="accent" style="stroke-width:2;stroke-dasharray:5 5">
      <rect x="535" y="215" width="55" height="40" rx="6"/><circle cx="562" cy="235" r="10"/>
      <path d="M600,215 h20 M600,228 h14 M600,241 h18"/>
    </g>
    <line class="ink" x1="545" y1="280" x2="535" y2="330"/><line class="ink" x1="605" y1="280" x2="615" y2="327"/>
    <g transform="translate(470,344) scale(.9)">
      <line class="ink" x1="-8" y1="-50" x2="-11" y2="0"/><line class="ink" x1="8" y1="-50" x2="11" y2="0"/>
      <path class="ink" d="M-21,-48 Q-24,-106 0,-108 Q24,-106 21,-48 Z" style="fill:var(--accent);fill-opacity:.25"/>
      <path class="ink" d="M15,-95 L45,-118"/>
      <path class="ink" d="M-15,-92 L-26,-62"/>
      <circle class="ink" cx="0" cy="-126" r="16" style="fill:var(--paper)"/>
      <g class="fill-ink"><circle cx="-14" cy="-136" r="7"/><circle cx="-4" cy="-143" r="7"/><circle cx="8" cy="-142" r="7"/><circle cx="16" cy="-133" r="6"/><circle cx="-18" cy="-124" r="6"/><circle cx="-16" cy="-112" r="5"/></g>
      <circle class="ink" cx="-1" cy="-124" r="4" style="stroke-width:1.8"/><circle class="ink" cx="9" cy="-124" r="4" style="stroke-width:1.8"/>
    </g>
    <text class="label" x="490" y="378">Building</text>
    <text class="sub" x="490" y="397">From research to a new product</text>
  </g>

  <!-- ============ Stage 3: the product manager ============ -->
  <g class="stage s3">
    <!-- lifecycle loop -->
    <g transform="translate(850,205)">
      <circle r="52" class="soft"/>
      <path class="accent" d="M0,-46 A46,46 0 0 1 46,0"/><path class="accent" d="M40,-12 l6,12 l8,-10"/>
      <path class="accent" d="M46,0 A46,46 0 0 1 0,46"/>
      <path class="accent" d="M0,46 A46,46 0 0 1 -46,0"/><path class="accent" d="M-40,12 l-6,-12 l-8,10"/>
      <path class="accent" d="M-46,0 A46,46 0 0 1 0,-46"/>
      <!-- shipped product -->
      <rect x="-20" y="-18" width="40" height="34" rx="4" class="paper"/>
      <rect x="-20" y="-18" width="40" height="34" rx="4" class="ink" style="stroke-width:2"/>
      <path class="ink" d="M-20,-8 h40" style="stroke-width:2"/>
      <path class="accent" d="M-8,4 l6,6 l11,-12" style="stroke-width:3"/>
    </g>
    <g transform="translate(760,328)">
      <line class="ink" x1="-8" y1="-50" x2="-11" y2="0"/><line class="ink" x1="8" y1="-50" x2="11" y2="0"/>
      <path class="ink" d="M-21,-48 Q-24,-106 0,-108 Q24,-106 21,-48 Z" style="fill:var(--accent);fill-opacity:.55"/>
      <path class="ink" d="M15,-95 L32,-80 L44,-92"/>
      <path class="ink" d="M-15,-92 L-22,-62"/>
      <circle class="ink" cx="0" cy="-126" r="16" style="fill:var(--paper)"/>
      <g class="fill-ink"><circle cx="-14" cy="-136" r="7"/><circle cx="-4" cy="-143" r="7"/><circle cx="8" cy="-142" r="7"/><circle cx="16" cy="-133" r="6"/><circle cx="-18" cy="-124" r="6"/><circle cx="-16" cy="-112" r="5"/></g>
      <circle class="ink" cx="-1" cy="-124" r="4" style="stroke-width:1.8"/><circle class="ink" cx="9" cy="-124" r="4" style="stroke-width:1.8"/>
    </g>
    <text class="label" x="790" y="362">Delivering</text>
    <text class="sub" x="790" y="381">Regulated products, full lifecycle</text>
  </g>

  <!-- ============ Stage 4: lead PM, building with AI for impact ============ -->
  <g class="stage s4">
    <!-- AI network -->
    <g class="accent" style="stroke-width:1.6;opacity:.8">
      <path d="M1040,98 L1000,60 M1040,98 L1085,62 M1040,98 L1095,118 M1000,60 L1050,40 M1085,62 L1050,40 M1085,62 L1130,85 M1095,118 L1130,85 M1000,60 L975,105"/>
    </g>
    <circle class="fill-accent" cx="1000" cy="60" r="6"/><circle class="fill-accent" cx="1085" cy="62" r="6"/>
    <circle class="fill-accent" cx="1050" cy="40" r="5"/><circle class="fill-accent" cx="1095" cy="118" r="5"/>
    <circle class="fill-accent" cx="1130" cy="85" r="5"/><circle class="fill-accent" cx="975" cy="105" r="4"/>
    <circle class="fill-accent pulse" cx="1040" cy="98" r="8"/>
    <!-- impact: people + heart -->
    <g transform="translate(1135,285)">
      <circle cx="0" cy="-38" r="8" class="warm"/><path class="warm" d="M-11,0 q0,-24 11,-24 q11,0 11,24 z"/>
      <circle cx="24" cy="-32" r="6.5" class="warm" opacity=".75"/><path class="warm" opacity=".75" d="M15,0 q0,-19 9,-19 q9,0 9,19 z"/>
    </g>
    <path class="warm pulse" d="M1160,200 c-6,-10 -22,-6 -18,6 c3,8 18,16 18,16 s15,-8 18,-16 c4,-12 -12,-16 -18,-6 z"/>
    <g transform="translate(1040,300) scale(1.1)">
      <line class="ink" x1="-8" y1="-50" x2="-11" y2="0"/><line class="ink" x1="8" y1="-50" x2="11" y2="0"/>
      <path class="ink" d="M-21,-48 Q-24,-106 0,-108 Q24,-106 21,-48 Z" style="fill:var(--accent)"/>
      <path class="ink" d="M15,-96 L32,-122"/><path class="ink" d="M-15,-96 L-32,-122"/>
      <circle class="ink" cx="0" cy="-126" r="16" style="fill:var(--paper)"/>
      <g class="fill-ink"><circle cx="-14" cy="-136" r="7"/><circle cx="-4" cy="-143" r="7"/><circle cx="8" cy="-142" r="7"/><circle cx="16" cy="-133" r="6"/><circle cx="-18" cy="-124" r="6"/><circle cx="-16" cy="-112" r="5"/></g>
      <circle class="ink" cx="-1" cy="-124" r="4" style="stroke-width:1.8"/><circle class="ink" cx="9" cy="-124" r="4" style="stroke-width:1.8"/>
      <path class="ink" d="M-3,-115 q4,3 8,0" style="stroke-width:1.8"/>
    </g>
    <text class="label" x="1050" y="333">Impact</text>
    <text class="sub" x="1050" y="352">Leading · building with AI</text>
  </g>
</svg>
